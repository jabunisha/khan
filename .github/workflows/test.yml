name: CI

on:
  push:
    branches:
      -main
permissions:
  id-token: write
  contents: read      
jobs:
   terraform :
     runs-on: ubuntu-latest

     steps:
       - name: Checkout code
         uses: actions/checkout@v4 

       - uses : azure/login@v3
         with :
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
         
       - name: Setup Terrafo
         uses: hashicorp/set

       - name: Terraform init
         run: terraform init

       - name: Terraform Plan
         run: terraform plan