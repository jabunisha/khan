name: mehnat


on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.
          tenant-id: ${{ secrets.
          subscription-id: ${{ se
          
      - name: Setup Terraform
        uses: hashicorp/setup-ter


      - name: Terraform Init
        run: terraform init


      - name: Terraform Plan
        run: terraform plan